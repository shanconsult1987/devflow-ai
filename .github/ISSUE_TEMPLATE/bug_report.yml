name: Bug Report

description: Report a DevFlow application defect.

title: "[BUG] "

labels:
  - bug

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the observed defect.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: Explain the correct behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Provide reproducible steps.
    validations:
      required: true